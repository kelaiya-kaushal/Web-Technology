<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 9 - Product Listing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f4f7fb; }
    .product-card { border: none; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 25px rgba(15, 23, 42, 0.08); }
    .product-card img { height: 220px; object-fit: cover; }
    .price { color: #0d6efd; font-weight: 700; font-size: 1.4rem; }
    .cart-pill { position: fixed; top: 20px; right: 20px; z-index: 10; }
  </style>
</head>
<body>
  <div class="cart-pill">
    <button class="btn btn-primary rounded-pill shadow">Cart <span id="cartCount" class="badge bg-light text-primary">0</span></button>
  </div>

  <div class="container py-5">
    <h2 class="text-center mb-4 fw-bold text-primary">Featured Products</h2>

    <div class="row g-4" id="productGrid">
      <div class="col-md-4">
        <div class="card product-card h-100">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80" class="card-img-top" alt="Smart Watch" />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Smart Watch</h5>
            <p class="text-muted">Water resistant, fitness tracking, AMOLED display.</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <span class="price">₹2,499</span>
              <button class="btn btn-primary add-to-cart">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card product-card h-100">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80" class="card-img-top" alt="Sneakers" />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Running Sneakers</h5>
            <p class="text-muted">Comfortable grip and lightweight design for everyday wear.</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <span class="price">₹1,799</span>
              <button class="btn btn-primary add-to-cart">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card product-card h-100">
          <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80" class="card-img-top" alt="Laptop" />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Ultrabook Laptop</h5>
            <p class="text-muted">14-inch, Intel i5, 16GB RAM, fast SSD storage.</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <span class="price">₹48,999</span>
              <button class="btn btn-primary add-to-cart">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-5 bg-white p-4 rounded shadow-sm">
      <h3 class="mb-4 text-primary">Checkout Form</h3>
      <form id="checkoutForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required />
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea class="form-control" id="address" rows="3" required></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">City</label>
            <input type="text" class="form-control" id="city" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" required />
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-between align-items-center">
          <strong>Total Items: <span id="totalItems">0</span></strong>
          <button type="submit" class="btn btn-success btn-lg">Checkout</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let cartCount = 0;
    const cartCountEl = document.getElementById('cartCount');
    const totalItemsEl = document.getElementById('totalItems');
    const addButtons = document.querySelectorAll('.add-to-cart');

    addButtons.forEach(button => {
      button.addEventListener('click', () => {
        cartCount++;
        cartCountEl.textContent = cartCount;
        totalItemsEl.textContent = cartCount;
        button.textContent = 'Added';
        button.disabled = true;
      });
    });

    document.getElementById('checkoutForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const city = document.getElementById('city').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!name || !email || !city || !phone) {
        alert('Please fill all checkout fields.');
        return;
      }

      alert('Thank you, ' + name + '! Your order is placed successfully.');
      this.reset();
    });
  </script>
</body>
</html>
