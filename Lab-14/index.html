<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 14 - Quiz Application</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ede9fe, #ecfeff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }
    .quiz-box {
      width: min(760px, 100%);
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      padding: 32px;
    }
    .title {
      text-align: center;
      font-size: 2rem;
      color: #4f46e5;
      margin-bottom: 18px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #475569;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .question {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 24px;
    }
    .options {
      display: grid;
      gap: 14px;
    }
    .option-btn {
      width: 100%;
      text-align: left;
      padding: 16px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .option-btn:hover {
      border-color: #6366f1;
      background: #eef2ff;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .primary-btn, .secondary-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-btn {
      background: #4f46e5;
      color: white;
    }
    .secondary-btn {
      background: #e2e8f0;
      color: #0f172a;
    }
    .result {
      text-align: center;
      display: none;
    }
    .result h3 {
      font-size: 2rem;
      color: #16a34a;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="quiz-box">
    <h1 class="title">Quiz App</h1>

    <div id="quizScreen">
      <div class="meta">
        <span id="questionCounter">Question 1/5</span>
        <span id="scoreText">Score: 0</span>
      </div>
      <div id="questionText" class="question"></div>
      <div id="options" class="options"></div>
      <div class="controls">
        <button id="prevBtn" class="secondary-btn">Previous</button>
        <button id="nextBtn" class="primary-btn">Next</button>
      </div>
    </div>

    <div id="resultScreen" class="result">
      <h3>Quiz Completed!</h3>
      <p id="resultText"></p>
      <button id="restartBtn" class="primary-btn">Play Again</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: 'Which HTML tag is used to create a hyperlink?',
        options: ['<link>', '<a>', '<img>', '<href>'],
        answer: '<a>'
      },
      {
        question: 'Which CSS property changes the text color?',
        options: ['color', 'background', 'padding', 'margin'],
        answer: 'color'
      },
      {
        question: 'Which JavaScript keyword declares a block-scoped variable?',
        options: ['var', 'let', 'const', 'function'],
        answer: 'let'
      },
      {
        question: 'Which HTML tag is used for the largest heading?',
        options: ['<h6>', '<h1>', '<head>', '<header>'],
        answer: '<h1>'
      },
      {
        question: 'Which CSS property is used to make an element flexible?',
        options: ['position', 'display', 'flex', 'float'],
        answer: 'display'
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    const selectedAnswers = new Array(questions.length).fill(null);

    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('options');
    const questionCounter = document.getElementById('questionCounter');
    const scoreText = document.getElementById('scoreText');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const resultText = document.getElementById('resultText');
    const restartBtn = document.getElementById('restartBtn');

    function renderQuestion() {
      const question = questions[currentQuestion];
      questionText.textContent = question.question;
      questionCounter.textContent = `Question ${currentQuestion + 1}/${questions.length}`;
      scoreText.textContent = `Score: ${score}`;

      optionsContainer.innerHTML = '';
      question.options.forEach((option) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.textContent = option;

        if (selectedAnswers[currentQuestion] === option) {
          button.style.borderColor = '#4f46e5';
          button.style.background = '#e0e7ff';
        }

        button.addEventListener('click', () => {
          selectedAnswers[currentQuestion] = option;
          renderQuestion();
        });

        optionsContainer.appendChild(button);
      });

      prevBtn.disabled = currentQuestion === 0;
      nextBtn.textContent = currentQuestion === questions.length - 1 ? 'Submit' : 'Next';
    }

    function calculateScore() {
      score = questions.reduce((total, question, index) => {
        return total + (selectedAnswers[index] === question.answer ? 1 : 0);
      }, 0);
    }

    function showResult() {
      calculateScore();
      quizScreen.classList.add('hidden');
      resultScreen.style.display = 'block';
      resultText.textContent = `You scored ${score} out of ${questions.length}. ${score >= 3 ? 'Great job!' : 'Keep practicing!'}`;
    }

    nextBtn.addEventListener('click', () => {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResult();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    });

    restartBtn.addEventListener('click', () => {
      currentQuestion = 0;
      score = 0;
      selectedAnswers.fill(null);
      resultScreen.style.display = 'none';
      quizScreen.classList.remove('hidden');
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
