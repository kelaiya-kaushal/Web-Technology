<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 7 - Bootstrap Dashboard with Accordion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      min-height: 100vh;
    }
    .main-card {
      background: rgba(255,255,255,0.94);
      border-radius: 20px;
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.12);
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="main-card p-4 p-md-5">
      <h2 class="text-center mb-4 fw-bold text-primary">College Admin Dashboard</h2>

      <div class="accordion" id="dashboardAccordion">
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingOne">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
              Overview Panel
            </button>
          </h2>
          <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#dashboardAccordion">
            <div class="accordion-body">
              <div class="row g-3">
                <div class="col-md-3">
                  <div class="card border-0 shadow-sm h-100 bg-primary text-white">
                    <div class="card-body">
                      <h6 class="text-uppercase">Students</h6>
                      <h3 class="mt-2">1200</h3>
                      <small>+15% this month</small>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card border-0 shadow-sm h-100 bg-success text-white">
                    <div class="card-body">
                      <h6 class="text-uppercase">Faculty</h6>
                      <h3 class="mt-2">88</h3>
                      <small>+3 new hires</small>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card border-0 shadow-sm h-100 bg-warning text-dark">
                    <div class="card-body">
                      <h6 class="text-uppercase">Courses</h6>
                      <h3 class="mt-2">42</h3>
                      <small>8 active labs</small>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card border-0 shadow-sm h-100 bg-info text-white">
                    <div class="card-body">
                      <h6 class="text-uppercase">Placements</h6>
                      <h3 class="mt-2">94%</h3>
                      <small>Strong hiring trend</small>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header" id="headingTwo">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
              Student Records
            </button>
          </h2>
          <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#dashboardAccordion">
            <div class="accordion-body">
              <div class="list-group">
                <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                  Rahul Sharma
                  <span class="badge bg-primary rounded-pill">Active</span>
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                  Priya Patel
                  <span class="badge bg-success rounded-pill">Verified</span>
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                  Ketan Desai
                  <span class="badge bg-warning text-dark rounded-pill">Pending</span>
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                  Neha Joshi
                  <span class="badge bg-secondary rounded-pill">Review</span>
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header" id="headingThree">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
              Performance Metrics
            </button>
          </h2>
          <div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree" data-bs-parent="#dashboardAccordion">
            <div class="accordion-body">
              <div class="mb-3">
                <label class="form-label">Web Technology</label>
                <div class="progress">
                  <div class="progress-bar bg-primary" style="width: 88%">88%</div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Data Structures</label>
                <div class="progress">
                  <div class="progress-bar bg-success" style="width: 76%">76%</div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">DBMS</label>
                <div class="progress">
                  <div class="progress-bar bg-warning" style="width: 65%">65%</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header" id="headingFour">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFour" aria-expanded="false" aria-controls="collapseFour">
              Admin Controls
            </button>
          </h2>
          <div id="collapseFour" class="accordion-collapse collapse" aria-labelledby="headingFour" data-bs-parent="#dashboardAccordion">
            <div class="accordion-body">
              <div class="card mb-3 shadow-sm border-0">
                <div class="card-body">
                  <h5 class="card-title">Quick Actions</h5>
                  <button type="button" class="btn btn-primary me-2 mb-2">Add Student</button>
                  <button type="button" class="btn btn-success me-2 mb-2">Generate Report</button>
                  <button type="button" class="btn btn-outline-secondary mb-2">Export Data</button>
                </div>
              </div>

              <nav aria-label="Pagination example">
                <ul class="pagination mb-0">
                  <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                  <li class="page-item active"><a class="page-link" href="#">1</a></li>
                  <li class="page-item"><a class="page-link" href="#">2</a></li>
                  <li class="page-item"><a class="page-link" href="#">3</a></li>
                  <li class="page-item"><a class="page-link" href="#">Next</a></li>
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
